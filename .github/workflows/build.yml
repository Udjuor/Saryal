name: Сборка установщика

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install

      - name: Модульные тесты
        run: npm test

      - name: Взять версию из метки релиза
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version

      - name: Собрать установщик
        run: npm run dist

      - name: Установить без вопросов
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/Kerdiis-School-Setup-*.exe).FullName
          # Установка для текущего пользователя явно: без неё NSIS на сервере без рабочего стола иногда падает.
          foreach ($try in 1..3) {
            $p = Start-Process $setup -ArgumentList '/S', '/currentuser' -Wait -PassThru
            Write-Host "Попытка $try, код выхода $($p.ExitCode)"
            if ($p.ExitCode -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          if ($p.ExitCode -ne 0) { throw "Код выхода установщика: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\kerdiis-school\KerdiisSchool.exe'
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter KerdiisSchool.exe | Select-Object -First 1).FullName
          }
          if (-not $exe) { throw 'Программа не установилась' }
          Write-Host "Установлено: $exe"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Kerdiis School.lnk")) { throw 'Нет ярлыка на рабочем столе' }
          "CAL_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Проверить установленную программу
        shell: pwsh
        env:
          SHOTS: shots
        run: |
          npm install --no-save playwright
          node scripts/e2e.cjs

      - name: Сохранить снимки экрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Kerdiis-School-Setup-*.exe
          if-no-files-found: error

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $file = (Get-ChildItem dist/Kerdiis-School-Setup-*.exe).FullName
          # Релиз могли создать вручную на GitHub: тогда только добавляем установщик.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --generate-notes }
          gh release upload $tag $file --clobber
